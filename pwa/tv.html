<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUHFLIX · Catálogo para TV</title><link rel="stylesheet" href="/pwa/tv.css?v=20261110.3"></head><body><header><strong>GUH<span>FLIX</span></strong><span>CATÁLOGO PARA TV</span></header><p id="notice" role="status">Entre com seu acesso de cliente. Esta versão usa recursos básicos do navegador da TV.</p><section id="login"><h1>Seu cinema nesta tela.</h1><form id="login-form" method="post" action="/pwa/tv.html"><label for="username">Usuário</label><input id="username" name="username" maxlength="64" autocomplete="username"><label for="password">Senha</label><input id="password" type="password" maxlength="128" autocomplete="current-password"><button id="enter" type="submit">Entrar</button></form><noscript>O JavaScript está desativado ou indisponível. Este navegador não consegue abrir o catálogo interativo.</noscript></section><section id="library" class="hidden"><nav><button id="all">Início</button><button id="movies">Filmes</button><button id="series">Séries</button><button id="live">TV ao vivo</button><button id="pair-open">Conectar celular</button><button id="logout">Sair / trocar conta</button></nav><p id="receiver-status" role="status"></p><section id="pair-box" class="hidden"><h2>Controle esta TV pelo celular</h2><p>No celular, abra <strong>guhflix-marley-api.onrender.com/pwa/</strong>, entre na mesma conta e escolha Conectar TV.</p><p id="pair-code" class="pair-code"></p><p id="pair-message" role="status"></p><button id="pair-generate">Gerar novo código</button><button id="pair-close">Fechar código</button></section><form id="search-form"><label for="query">Buscar título</label><input id="query" maxlength="120"><button id="search" type="submit">Pesquisar</button></form><h1 id="library-title">Escolha sua história.</h1><div id="cards"></div><button id="previous">Página anterior</button><button id="next">Próxima página</button></section><section id="details" class="hidden"><button id="back">Voltar ao catálogo</button><h1 id="title"></h1><p id="synopsis"></p><div id="season-box" class="hidden"><label for="season">Temporada</label><select id="season"></select></div><div id="episodes"></div><div id="episode-pages" class="hidden"><button id="ep-previous">Episódios anteriores</button><button id="ep-next">Próximos episódios</button></div><button id="play">Assistir nesta TV</button></section><section id="player" class="hidden"><video id="video" controls preload="auto" tabindex="0"></video><div id="player-top" class="player-top"><h2 id="playing-title"></h2></div><p id="player-status" class="player-status" role="status"></p><div id="player-tools" class="player-tools"><button id="pause">Pausar / continuar</button><button id="rewind">−10s</button><button id="forward">+10s</button><label for="quality">Qualidade</label><select id="quality"><option value="720">Leve · até 720p quando disponível</option><option value="480">Mais leve · até 480p quando disponível</option><option value="0">Automática da fonte</option></select><button id="fullscreen">Tela cheia</button><button id="retry">Tentar novamente</button><button id="close">Fechar vídeo</button></div></section><script src="/pwa/tv.js?v=20261110.3"></script></body></html>
