name: Gfilmes offline-license protocol
on:
  push:
    branches:
      - 'feature/gfilmes-licenca-offline-30d-20261119'
    paths:
      - 'tv/app/src/main/java/com/guhflix/shell/OfflinePermit.java'
      - 'tv/app/src/test/java/com/guhflix/shell/OfflinePermitSmoke.java'
      - '.github/workflows/gfilmes-offline-license.yml'
  pull_request:
    branches: ['guhflix-platform']
    paths:
      - 'tv/app/src/main/java/com/guhflix/shell/OfflinePermit.java'
      - 'tv/app/src/test/java/com/guhflix/shell/OfflinePermitSmoke.java'
      - '.github/workflows/gfilmes-offline-license.yml'
permissions:
  contents: read
jobs:
  offline-license-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile portable verifier and smoke tests
        run: |
          mkdir -p /tmp/gfl-license-tests
          javac -encoding UTF-8 -d /tmp/gfl-license-tests \
            tv/app/src/main/java/com/guhflix/shell/OfflinePermit.java \
            tv/app/src/test/java/com/guhflix/shell/OfflinePermitSmoke.java
      - name: Validate RSA signed offline license rules
        run: java -cp /tmp/gfl-license-tests com.guhflix.shell.OfflinePermitSmoke
