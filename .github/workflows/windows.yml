name: GUHFLIX Windows native
on:
  push:
    branches: [guhflix-windows]
  workflow_dispatch:
concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-tests:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_PROFILE_RELEASE_LTO: false
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_OPT_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
      - name: Prepare original player library for media integration test
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'original-player-package.zip'
          Invoke-WebRequest 'https://guhflix-tv-download.onrender.com/GUHFLIX-Windows-3.0.3.zip' -OutFile $zip
          if ((Get-FileHash $zip).Hash.ToLower() -ne '50deefb1adb3c8ab912f669b6e9547afe3d95d2daa211a9cc038f1ac1e96c77b') { throw 'Player archive checksum mismatch' }
          $dir = Join-Path $env:RUNNER_TEMP 'original-player'
          Expand-Archive $zip $dir
          $dll = Join-Path $dir 'GUHFLIX-Windows/libmpv-2.dll'
          if ((Get-FileHash $dll).Hash.ToLower() -ne 'd2d081547efea8a1530f4ba0bf58a0d72069b25c40d8b2a7071cea5aa82381c6') { throw 'Original DLL checksum mismatch' }
          "GUHFLIX_TEST_MPV_DLL=$dll" >> $env:GITHUB_ENV
      - name: Native tests including Windows DPAPI
        run: cargo test --locked
      - name: Play synthetic local HLS with original MPV DLL
        run: cargo test --locked mpv_integracao_hls_com_dll_original -- --ignored --nocapture
      - name: Build Windows executable with static C runtime
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Verify entry into main and collect startup evidence
        shell: powershell
        run: |
          $exe = Join-Path $pwd 'target/x86_64-pc-windows-msvc/release/guhflix-windows.exe'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'guhflix-startup-test'
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $null = $p.Handle
          $finished = $p.WaitForExit(15000)
          $log = Join-Path $env:APPDATA 'GUHFLIX/inicio.txt'
          if (-not (Test-Path $log)) { throw 'No startup log: program did not reach main' }
          Get-Content $log
          $body = Get-Content $log -Raw
          if ($body -notmatch 'instância reservada') { throw 'Did not reserve instance' }
          if ($finished) {
            $code = $p.ExitCode
            Write-Output ('Exit code: 0x{0:X8}' -f [int]$code)
            if ($code -lt 0) { throw 'Native exception during startup' }
            if ($code -ne 0 -and $body -notmatch 'fatal') { throw 'Unexpected early exit' }
            Write-Output 'Reached main; display initialization may fail on the headless CI runner. This does not validate a physical Windows 10 display or playback.'
          } else {
            Write-Output "Process remains running. Window: $($p.MainWindowTitle)"
            $null = $p.CloseMainWindow()
            if (-not $p.WaitForExit(5000)) { $p.Kill() }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GUHFLIX-startup-evidence
          path: ${{ runner.temp }}/guhflix-startup-test/GUHFLIX/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GUHFLIX-Windows-native-3.1.0
          path: target/x86_64-pc-windows-msvc/release/guhflix-windows.exe
